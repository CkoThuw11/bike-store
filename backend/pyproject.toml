# Linter and formatter, mirrors CI lint job (make lint / make format)
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

# Static type analysis, mirrors CI type-check job (make type-check). Advisory: does not block merge.
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false
warn_return_any = false
disallow_untyped_defs = true

# Coverage for the unit suite (make coverage). Reported, not gated — actual coverage
# is ~64% on domain/application today. Target is 100% on domain/application; re-add
# fail_under once real coverage catches up to a threshold worth enforcing.
[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
show_missing = true
