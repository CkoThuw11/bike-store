<aside class="sidebar">
  <div class="sidebar__brand">
    <span class="sidebar__brand-icon">🚲</span>
    <span class="sidebar__logo-text">
      Bike Shop
    </span>
  </div>

  <p class="sidebar__tagline">Operator Console</p>

  <nav class="sidebar__nav">
    @for (group of navGroups; track group.title) {
      <div class="sidebar__group">
        <p class="sidebar__group-title">
          {{ group.title }}
        </p>

        @for (item of group.items; track item.route) {
          <a
            class="sidebar__link"
            [routerLink]="item.route"
            routerLinkActive="sidebar__link--active"
            [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' }"
          >
            <svg class="sidebar__icon" width="18" height="18"
                 viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <use [attr.href]="'#icon-' + item.icon" />
            </svg>
            {{ item.label }}
          </a>
        }
      </div>
    }
  </nav>

  <div class="sidebar__footer">
    @if (user(); as u) {
      <div class="sidebar__user">
        <div class="sidebar__avatar">
          {{ initials() }}
        </div>
        <div class="sidebar__user-copy">
          <p class="sidebar__user-name">{{ u.fullname }}</p>
          <p class="sidebar__user-email">{{ u.email }}</p>
        </div>
      </div>
    }

    <button
      class="sidebar__logout"
      (click)="logout()"
    >
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      Sign out
    </button>
  </div>

</aside>
