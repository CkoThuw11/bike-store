<div class="toast-region" role="region" aria-live="polite" aria-label="Notifications">
  @for (toast of toasts(); track toast.id) {
    <div class="toast-card" [attr.data-kind]="toast.kind" role="status">
      <span class="toast-card__dot" aria-hidden="true"></span>
      <span class="toast-card__message">{{ toast.message }}</span>
      @if (toast.action) {
        <button type="button" class="toast-card__action" (click)="invokeAction(toast.id)">
          {{ toast.action.label }}
        </button>
      }
      <button type="button" class="toast-card__close" aria-label="Dismiss notification" (click)="dismiss(toast.id)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
  }
</div>
