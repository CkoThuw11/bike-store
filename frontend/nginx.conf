server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Angular routing — always fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls → FastAPI backend container
    # Angular calls /auth/login, /brands/, etc.
    # Nginx forwards them to http://backend:8000/auth/login, etc.
    location ~ ^/(auth|brands|categories|products|stores|staffs|stocks|customers|orders|order-items)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for JWT HttpOnly cookies
        proxy_pass_header Set-Cookie;
        proxy_cookie_path / "/; SameSite=Lax";
    }

    # Health check endpoint
    location /health {
        proxy_pass http://backend:8000/health;
    }
}